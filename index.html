<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>한국 시간 (KST)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b0d12;
    color: #f4f6fb;
    font-family: 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .wrap { width: 100%; max-width: 720px; }
  .label { font-size: clamp(14px, 2.2vw, 18px); letter-spacing: .3em; color: #8a93a6; margin-bottom: 18px; }
  .time {
    font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    font-weight: 700; font-size: clamp(56px, 16vw, 168px);
    letter-spacing: .02em; line-height: 1;
    color: #f4f6fb; text-shadow: 0 4px 40px rgba(120,170,255,.25);
  }
  .time .sec { color: #6ea8ff; }
  .date { margin-top: 22px; font-size: clamp(16px, 3vw, 26px); color: #c4cbdb; }
  .tz { margin-top: 10px; font-size: clamp(12px, 1.8vw, 15px); color: #6e7a96; letter-spacing: .2em; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="label">KOREA STANDARD TIME</div>
    <div class="time" id="clock">--:--:--</div>
    <div class="date" id="date">----년 --월 --일 (-)</div>
    <div class="tz">Asia / Seoul · UTC+9</div>
  </main>
<script>
  const fmt = new Intl.DateTimeFormat('ko-KR', {
    timeZone: 'Asia/Seoul',
    year: 'numeric', month: 'numeric', day: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    hourCycle: 'h23', weekday: 'short'
  });
  const pad = n => String(n).padStart(2, '0');
  let timer;
  function tick() {
    const now = new Date();
    const parts = fmt.formatToParts(now);
    const get = t => parts.find(p => p.type === t)?.value ?? '';
    document.getElementById('clock').innerHTML =
      `${pad(get('hour'))}:${pad(get('minute'))}<span class="sec">:${pad(get('second'))}</span>`;
    document.getElementById('date').textContent =
      `${get('year')}년 ${pad(get('month'))}월 ${pad(get('day'))}일 (${get('weekday')})`;
    timer = setTimeout(tick, 1000 - (now.getTime() % 1000));
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { clearTimeout(timer); tick(); }
  });
  tick();
</script>
</body>
</html>
