<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>클릭 카운터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100%;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
    background: #0d1117;
    color: #f5f5f5;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px;
    padding: 24px;
  }
  #count {
    font-size: clamp(48px, 12vw, 96px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #ffb74d;
  }
  #btn {
    appearance: none;
    border: none;
    cursor: pointer;
    padding: 18px 48px;
    font-size: clamp(18px, 3vw, 24px);
    font-weight: 700;
    color: #0d1117;
    background: #ffb74d;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(255, 183, 77, .35);
    transition: transform .08s ease, box-shadow .15s ease;
  }
  #btn:hover { box-shadow: 0 10px 28px rgba(255, 183, 77, .5); }
  #btn:active { transform: scale(.96); }
</style>
</head>
<body>
  <div id="count" aria-live="polite">0</div>
  <button id="btn" type="button">클릭</button>
<script>
  (function () {
    'use strict';
    var n = 0;
    var countEl = document.getElementById('count');
    document.getElementById('btn').addEventListener('click', function () {
      n += 1;
      countEl.textContent = n;
    });
  })();
</script>
</body>
</html>
