<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>사랑해</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #ffd1dc 0%, #ff8fab 50%, #ff5d8f 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  gap: 32px;
}
.heart { font-size: 72px; filter: drop-shadow(0 4px 12px rgba(255,93,143,0.5)); }
button {
  padding: 18px 44px;
  font-size: 20px;
  font-weight: 700;
  color: #d6336c;
  background: #fff;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(214, 51, 108, 0.35);
  transition: transform 0.1s, box-shadow 0.2s;
}
button:hover { box-shadow: 0 8px 24px rgba(214, 51, 108, 0.5); }
button:active { transform: translateY(2px); }
#msg {
  font-size: 64px;
  font-weight: 800;
  color: #fff;
  text-shadow: 0 4px 16px rgba(214, 51, 108, 0.4);
  min-height: 80px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
#msg.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>
<div class="heart">💖</div>
<button id="btn">눌러보세요</button>
<div id="msg"></div>
<script>
document.getElementById('btn').addEventListener('click', () => {
  const m = document.getElementById('msg');
  m.textContent = '사랑해';
  m.classList.remove('show');
  void m.offsetWidth;
  m.classList.add('show');
});
</script>
</body>
</html>
