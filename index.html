<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>현재 한국 시간 (KST)</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg2: #11141c;
    --fg: #e8ecf3;
    --muted: #8b93a7;
    --accent: #6ee7ff;
    --shadow: 0 0 40px rgba(110, 231, 255, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 70%);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Menlo", "Consolas", "D2Coding", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  main {
    text-align: center;
    padding: 2rem;
  }
  .label {
    font-size: clamp(0.85rem, 2vw, 1rem);
    letter-spacing: 0.4em;
    color: var(--muted);
    margin-bottom: 1.25rem;
    text-transform: uppercase;
  }
  .clock {
    font-size: clamp(3rem, 14vw, 8.5rem);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--fg);
    text-shadow: var(--shadow);
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
  }
  .clock .sep {
    color: var(--accent);
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { opacity: 0.35; } }
  .date {
    margin-top: 1.5rem;
    font-size: clamp(1rem, 2.6vw, 1.5rem);
    color: var(--muted);
    letter-spacing: 0.06em;
  }
  .footer {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    color: #4a516a;
    letter-spacing: 0.2em;
  }
</style>
</head>
<body>
<main>
  <div class="label">Korea Standard Time</div>
  <div class="clock" id="clock" aria-live="polite">
    <span id="hh">00</span><span class="sep">:</span><span id="mm">00</span><span class="sep">:</span><span id="ss">00</span>
  </div>
  <div class="date" id="date">—</div>
  <div class="footer">KST · UTC+9</div>
</main>
<script>
  const pad = (n) => String(n).padStart(2, "0");
  const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
  const hhEl = document.getElementById("hh");
  const mmEl = document.getElementById("mm");
  const ssEl = document.getElementById("ss");
  const dateEl = document.getElementById("date");

  function nowKST() {
    const now = new Date();
    const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
    return new Date(utcMs + 9 * 3600 * 1000);
  }

  function render() {
    const k = nowKST();
    hhEl.textContent = pad(k.getHours());
    mmEl.textContent = pad(k.getMinutes());
    ssEl.textContent = pad(k.getSeconds());
    dateEl.textContent = `${k.getFullYear()}년 ${k.getMonth() + 1}월 ${k.getDate()}일 ${weekdays[k.getDay()]}요일`;
  }

  render();
  setInterval(render, 1000);
</script>
</body>
</html>
